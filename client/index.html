<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoomNetPlatformer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  canvas { display: block; }
  #hud, #help, #status {
    position: fixed; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe3ff; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none;
  }
  #hud { top: 10px; left: 12px; }
  #help { bottom: 10px; left: 12px; color: #8fa6c4; display: none; }
  #status { top: 50%; left: 0; right: 0; text-align: center; color: #9db4d4; font-size: 14px; }
</style>
</head>
<body>
  <div id="hud"></div>
  <div id="status">starting...</div>
  <div id="help">WASD move   SPACE jump   SHIFT dash   E use   Q/R rotate   wheel zoom   ?proj=orthographic</div>

  <!--
    An import map rather than a bundler. The client is plain ES modules and the
    wasm build already emits one, so a build step would exist only to rewrite
    the word "three" -- and it would put a compiled artefact between the source
    and what runs, which is the last thing wanted while the renderer is the
    thing being debugged.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/": "/vendor/three/"
    }
  }
  </script>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    addEventListener('error', (e) => {
      document.getElementById('status').textContent = `error: ${e.message}`
    })
    addEventListener('unhandledrejection', (e) => {
      document.getElementById('status').textContent = `error: ${e.reason?.message ?? e.reason}`
    })
  </script>
</body>
</html>
