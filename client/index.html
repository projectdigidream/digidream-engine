<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  MOBILE VIEWPORT, and every part of it is load-bearing:
    viewport-fit=cover   lets the page reach under a notch and a home
                         indicator, which is what makes env(safe-area-inset-*)
                         mean anything -- without it the insets are all zero
                         and the controls sit in a letterbox.
    maximum-scale=1      a double-tap on a game is not a request to zoom the
                         page, and pinch here is the camera's.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Digidream</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0d12;
    /* A game is not a document. Without these, a drag that was meant to turn
       the camera scrolls the page instead, a downward one triggers Chrome's
       pull-to-refresh and reloads mid-fight, and a long press selects the HUD
       text. touch-action is the one that matters: it stops the browser
       waiting 300ms to find out whether a touch was a gesture. */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  /* Everything that is text moves in from the edges once there are safe-area
     insets to respect -- a rounded corner or a notch eats the first few
     millimetres, and the health number is the one thing a player must be able
     to read while something is shooting at them. */
  @supports (padding: env(safe-area-inset-left)) {
    #curtain { position: fixed; inset: 0; background: #000; opacity: 0;
               pointer-events: none; z-index: 40; transition: opacity 0s linear; }
    .letterbox { position: fixed; left: 0; right: 0; height: 0; background: #000;
                 pointer-events: none; z-index: 41; transition: height 0s linear; }
    #lbtop { top: 0; }
    #lbbot { bottom: 0; }
    #hud    { top: calc(10px + env(safe-area-inset-top));
              left: calc(12px + env(safe-area-inset-left)); }
    #help   { bottom: calc(10px + env(safe-area-inset-bottom));
              left: calc(12px + env(safe-area-inset-left)); }
  }

  /* With the thumbstick mounted, the corner it lives in belongs to it. The
     help line and the debug block are moved out of its way rather than drawn
     under it -- text behind a translucent control is unreadable and looks
     like a rendering fault. */
  .dnp-touch-on #help { display: none !important; }
  .dnp-touch-on #hud { font-size: 10px; opacity: .75; }

  /* The two bindings that have no button to label them. Centred low, above
     the controls rather than over them, and it fades out on the first touch:
     a legend that stays is a legend in the way. */
  #touchhelp {
    position: fixed; left: 0; right: 0;
    bottom: calc(38vh + env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
    font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe3ff; text-shadow: 0 1px 3px #000;
    transition: opacity 400ms linear;
  }
  #touchhelp .dim { color: #8fa6c4; font-size: 11px; }
  #touchhelp[hidden] { display: none; }
  #hud, #help, #status {
    position: fixed; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe3ff; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none;
  }
  #hud { top: 10px; left: 12px; }
  /* The loading bar. Centred under the status line it annotates, and hidden
     until there is something to report -- an empty bar sitting at zero on a
     map that loaded instantly is worse than no bar. */
  #loading {
    position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    width: min(420px, 60vw); display: none;
  }
  #loading .track {
    height: 6px; background: #1b2230; border: 1px solid #2c3648; border-radius: 3px;
    overflow: hidden;
  }
  #loading .fill {
    height: 100%; width: 0%; background: #5b8fd6; transition: width 120ms linear;
  }
  #loading .detail {
    margin-top: 6px; text-align: center; color: #6f8098;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #help { bottom: 10px; left: 12px; color: #8fa6c4; display: none; }
  /* HEALTH is drawn by the HUD now, from the module's UI layout
     (client/src/render/layout.js, docs/UI_LAYOUT.md). */
  #status { top: 50%; left: 0; right: 0; text-align: center; color: #9db4d4; font-size: 14px; }
  /* The way back to the studio, only when the studio sent us here (?studio=1).
     A plain link: the studio is a page on the same origin. */
  #studio-back {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    z-index: 60; padding: 10px 14px; border-radius: 8px; text-decoration: none;
    background: rgba(27,34,48,.85); color: #cfe3ff; border: 1px solid rgba(207,227,255,.28);
    font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: auto;
  }
  #studio-back[hidden] { display: none; }
</style>
</head>
<body>
  <!-- The curtain and the letterbox bars (design 4.1). Drawn OVER everything
       and clickable through, because they are a picture rather than a control.
       CSS transitions carry the timing, so a fade costs no per-frame JS. -->
  <div id="curtain"></div>
  <div id="lbtop" class="letterbox"></div>
  <div id="lbbot" class="letterbox"></div>
  <div id="hud"></div>
  <div id="status">starting...</div>
  <div id="loading"><div class="track"><div class="fill"></div></div><div class="detail"></div></div>
  <div id="help">WASD move   SPACE jump   SHIFT dash   G grab   E use   F attack   Q/R rotate   wheel zoom   ?proj=orthographic</div>
  <!--
    The touch bindings, shown once and then got out of the way. A phone has no
    room for a permanent legend and the controls are labelled anyway; what a
    first-time player needs is to be told the two that are NOT labelled --
    that the empty part of the screen turns the camera, and that two fingers
    zoom. Dismissed by touching it, and by the first thing that happens.
  -->
  <div id="touchhelp" hidden>
    <div>drag anywhere to turn &nbsp;·&nbsp; pinch to zoom</div>
    <div class="dim">thumb in the bottom-left corner to move</div>
  </div>
  <a id="studio-back" href="/studio/" hidden>◀ Studio</a>
  <script>
    if (new URLSearchParams(location.search).get('studio')) {
      document.getElementById('studio-back').hidden = false
    }
  </script>

  <!--
    An import map rather than a bundler. The client is plain ES modules and the
    wasm build already emits one, so a build step would exist only to rewrite
    the word "three" -- and it would put a compiled artefact between the source
    and what runs, which is the last thing wanted while the renderer is the
    thing being debugged.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/": "/vendor/three/"
    }
  }
  </script>
  <!--
    THE NATIVE SHELL'S HOOK, and nothing in a browser.

    A CLASSIC script, deliberately: the spec runs these in order before
    deferred module scripts, so whatever this sets is in place by the time
    main.js reads it. main.js decides its transport at module scope by asking
    whether `window.dnp` exists, and a hook that ran afterwards would be a
    hook that never ran. See client/shell.js, which is empty on purpose.
  -->
  <script src="/shell.js"></script>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    addEventListener('error', (e) => {
      document.getElementById('status').textContent = `error: ${e.message}`
    })
    addEventListener('unhandledrejection', (e) => {
      document.getElementById('status').textContent = `error: ${e.reason?.message ?? e.reason}`
    })
  </script>
</body>
</html>
