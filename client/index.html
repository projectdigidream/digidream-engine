<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digidream</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  canvas { display: block; }
  #hud, #help, #status {
    position: fixed; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe3ff; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none;
  }
  #hud { top: 10px; left: 12px; }
  /* The loading bar. Centred under the status line it annotates, and hidden
     until there is something to report -- an empty bar sitting at zero on a
     map that loaded instantly is worse than no bar. */
  #loading {
    position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    width: min(420px, 60vw); display: none;
  }
  #loading .track {
    height: 6px; background: #1b2230; border: 1px solid #2c3648; border-radius: 3px;
    overflow: hidden;
  }
  #loading .fill {
    height: 100%; width: 0%; background: #5b8fd6; transition: width 120ms linear;
  }
  #loading .detail {
    margin-top: 6px; text-align: center; color: #6f8098;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #help { bottom: 10px; left: 12px; color: #8fa6c4; display: none; }
  /* HEALTH. Bottom-left, above the help line, and deliberately large: it is the
     one number a player looks at while something is shooting them, and the HUD
     block in the corner is a debug readout nobody reads under pressure. */
  #health {
    position: fixed; left: 12px; bottom: 34px; width: min(240px, 40vw);
    display: none;
  }
  #health .row {
    display: flex; align-items: baseline; gap: 8px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe3ff;
    text-shadow: 0 1px 2px #000;
  }
  #health .num { font-size: 20px; font-weight: 600; min-width: 3ch; text-align: right; }
  #health .track {
    margin-top: 4px; height: 8px; background: #1b2230;
    border: 1px solid #2c3648; border-radius: 3px; overflow: hidden;
  }
  /* No transition on the fill: a hit should read as instant. A smoothed bar
     makes a burst of damage look like one slow drain and hides how many hits
     landed. */
  #health .fill { height: 100%; width: 100%; background: #5fbf6a; }
  #status { top: 50%; left: 0; right: 0; text-align: center; color: #9db4d4; font-size: 14px; }
</style>
</head>
<body>
  <div id="hud"></div>
  <div id="status">starting...</div>
  <div id="loading"><div class="track"><div class="fill"></div></div><div class="detail"></div></div>
  <div id="health">
    <div class="row"><span class="num">--</span><span class="label">health</span></div>
    <div class="track"><div class="fill"></div></div>
  </div>
  <div id="help">WASD move   SPACE jump   SHIFT dash   E use   F attack   Q/R rotate   wheel zoom   ?proj=orthographic</div>

  <!--
    An import map rather than a bundler. The client is plain ES modules and the
    wasm build already emits one, so a build step would exist only to rewrite
    the word "three" -- and it would put a compiled artefact between the source
    and what runs, which is the last thing wanted while the renderer is the
    thing being debugged.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/": "/vendor/three/"
    }
  }
  </script>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    addEventListener('error', (e) => {
      document.getElementById('status').textContent = `error: ${e.message}`
    })
    addEventListener('unhandledrejection', (e) => {
      document.getElementById('status').textContent = `error: ${e.reason?.message ?? e.reason}`
    })
  </script>
</body>
</html>
